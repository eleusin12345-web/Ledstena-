<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>ENT Pro Elite | Подготовка к ЕНТ</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script src="https://unpkg.com/lucide@latest"></script>
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #0f172a; color: #f8fafc; }
        .fade-in { animation: fadeIn 0.4s cubic-bezier(0.4, 0, 0.2, 1) forwards; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .pop-in { animation: popIn 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275) forwards; }
        @keyframes popIn { from { opacity: 0; transform: scale(0.9); } to { opacity: 1; transform: scale(1); } }
        .shake { animation: shake 0.4s cubic-bezier(.36,.07,.19,.97) both; }
        @keyframes shake {
            10%, 90% { transform: translate3d(-1px, 0, 0); } 20%, 80% { transform: translate3d(2px, 0, 0); }
            30%, 50%, 70% { transform: translate3d(-4px, 0, 0); } 40%, 60% { transform: translate3d(4px, 0, 0); }
        }
        ::-webkit-scrollbar { width: 6px; }
        ::-webkit-scrollbar-track { background: #0f172a; }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 10px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }
        .glass-dark { background: rgba(30, 41, 59, 0.7); backdrop-filter: blur(16px); border: 1px solid rgba(255, 255, 255, 0.05); }
        .option-radio { transition: all 0.2s ease; }
        .bg-glow { position: fixed; top: -20%; left: -10%; width: 50vw; height: 50vw; background: radial-gradient(circle, rgba(99,102,241,0.15) 0%, rgba(15,23,42,0) 70%); z-index: -1; pointer-events: none; }
    </style>
</head>
<body class="h-screen flex overflow-hidden selection:bg-indigo-500/30 selection:text-indigo-200">
    <div class="bg-glow"></div>

    <!-- Desktop Sidebar -->
    <aside class="hidden md:flex w-64 flex-col bg-slate-900 border-r border-slate-800 z-20">
        <div class="h-20 flex items-center px-6 border-b border-slate-800">
            <div class="w-10 h-10 bg-gradient-to-br from-indigo-500 to-purple-600 rounded-xl flex items-center justify-center mr-3 shadow-lg shadow-indigo-500/20">
                <i data-lucide="zap" class="text-white w-5 h-5"></i>
            </div>
            <span class="text-xl font-extrabold tracking-tight bg-clip-text text-transparent bg-gradient-to-r from-white to-slate-400">ENT Elite</span>
        </div>
        
        <nav class="flex-1 py-6 px-4 space-y-2">
            <button onclick="navigate('dashboard')" id="nav-dashboard" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
                <i data-lucide="layout-grid" class="w-5 h-5"></i> Тренировка
            </button>
            <button onclick="navigate('history')" id="nav-history" class="nav-btn w-full flex items-center gap-3 px-4 py-3 rounded-xl text-sm font-semibold transition-all text-slate-400 hover:bg-slate-800 hover:text-white">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i> Статистика и База
            </button>
        </nav>
        
        <div class="p-6 border-t border-slate-800">
            <div class="bg-slate-800/50 border border-slate-700/50 rounded-2xl p-4 text-center">
                <i data-lucide="database" class="w-6 h-6 text-emerald-400 mx-auto mb-2"></i>
                <p class="text-xs text-slate-400 font-medium"><span id="db-count" class="text-emerald-400 font-bold">80</span> вопросов · Облако подключено</p>
            </div>
        </div>
    </aside>

    <!-- Main Content -->
    <main class="flex-1 relative flex flex-col h-full bg-slate-900/50">
        <!-- Mobile Header -->
        <header class="md:hidden h-16 glass-dark border-b border-slate-800 flex items-center justify-center px-4 z-20 sticky top-0">
            <div class="flex items-center gap-2">
                <i data-lucide="zap" class="text-indigo-500 w-5 h-5"></i>
                <span class="font-extrabold text-lg tracking-wide text-white">ENT Elite</span>
            </div>
        </header>

        <!-- Dynamic Content Container -->
        <div id="app-content" class="flex-1 overflow-y-auto p-4 md:p-8 pb-24 md:pb-8 relative scroll-smooth">
            <div id="loader" class="absolute inset-0 bg-slate-900 z-50 flex flex-col items-center justify-center">
                <div class="w-12 h-12 border-4 border-slate-700 border-t-indigo-500 rounded-full animate-spin mb-4"></div>
                <p class="text-sm font-medium text-slate-400 tracking-widest uppercase">Подключение к базе данных...</p>
            </div>
        </div>

        <!-- Mobile Bottom Nav -->
        <nav class="md:hidden absolute bottom-0 left-0 w-full glass-dark border-t border-slate-800 flex justify-around p-2 z-30 pb-safe">
            <button onclick="navigate('dashboard')" id="nav-mob-dashboard" class="nav-mob-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-indigo-400 transition-colors w-20">
                <i data-lucide="layout-grid" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Тесты</span>
            </button>
            <button onclick="navigate('history')" id="nav-mob-history" class="nav-mob-btn flex flex-col items-center gap-1.5 p-2 text-slate-500 hover:text-indigo-400 transition-colors w-20">
                <i data-lucide="bar-chart-3" class="w-5 h-5"></i>
                <span class="text-[10px] font-bold">Успехи</span>
            </button>
        </nav>
    </main>

    <!-- Modal for Mistakes Review -->
    <div id="review-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity p-4">
        <div class="bg-slate-800 border border-slate-700 rounded-3xl shadow-2xl max-w-2xl w-full max-h-[85vh] flex flex-col transform scale-95 transition-transform" id="review-modal-content">
            <div class="p-6 border-b border-slate-700 flex items-center justify-between">
                <h3 class="text-xl font-bold text-white flex items-center gap-2">
                    <i data-lucide="file-text" class="w-5 h-5 text-indigo-400"></i> Разбор ошибок теста
                </h3>
                <button onclick="closeReviewModal()" class="text-slate-400 hover:text-white p-2 rounded-xl bg-slate-700/50 hover:bg-slate-700 transition-colors">
                    <i data-lucide="x" class="w-5 h-5"></i>
                </button>
            </div>
            <div class="p-6 overflow-y-auto space-y-4 flex-1" id="review-modal-body">
                <!-- Заполняется динамически -->
            </div>
        </div>
    </div>

    <!-- Confirm Exit Modal -->
    <div id="exit-modal" class="fixed inset-0 bg-slate-900/80 backdrop-blur-sm z-50 hidden items-center justify-center opacity-0 transition-opacity">
        <div class="bg-slate-800 border border-slate-700 p-6 rounded-3xl shadow-2xl max-w-sm w-full mx-4 transform scale-95 transition-transform" id="exit-modal-content">
            <div class="w-12 h-12 bg-rose-500/20 text-rose-500 rounded-full flex items-center justify-center mb-4"><i data-lucide="alert-triangle" class="w-6 h-6"></i></div>
            <h3 class="text-xl font-bold text-white mb-2">Прервать тест?</h3>
            <p class="text-sm text-slate-400 mb-6 leading-relaxed">Твой прогресс в этом тесте сгорит. Точно хочешь выйти?</p>
            <div class="flex gap-3">
                <button onclick="closeExitModal()" class="flex-1 px-4 py-3 text-sm font-bold text-slate-300 bg-slate-700 hover:bg-slate-600 rounded-xl transition-colors">Остаться</button>
                <button onclick="confirmExitTest()" class="flex-1 px-4 py-3 text-sm font-bold text-white bg-rose-600 hover:bg-rose-500 rounded-xl transition-colors">Выйти</button>
            </div>
        </div>
    </div>

    <script type="module">
        import { initializeApp } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-app.js";
        import { getAuth, signInAnonymously, signInWithCustomToken, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-auth.js";
        import { getFirestore, collection, addDoc, getDocs } from "https://www.gstatic.com/firebasejs/11.6.1/firebase-firestore.js";

        const firebaseConfig = typeof __firebase_config !== 'undefined' ? JSON.parse(__firebase_config) : { projectId: "demo-project" };
        const appId = typeof __app_id !== 'undefined' ? __app_id : 'ent-pro-elite';
        let app, auth, db, user, useLocalFallback = false;

        try { app = initializeApp(firebaseConfig); auth = getAuth(app); db = getFirestore(app); } 
        catch (e) { useLocalFallback = true; }

        /* --- БАЗА ВОПРОСОВ (80 ШТУК) --- */
        const questionBank = [
            { q: "Способ заострения края однослойного каменного орудия путем создания мелких выемок (подобно зубьям пилы):", options: ["Ретушь", "Рубка", "Пиление", "Теска"], correct: 0, explanation: "Ретушь — техника обработки камня в каменном веке для создания острого лезвия." },
            { q: "Хан, чье правление оставило след в истории казахов, башкир, ногайцев, и установивший дипломатические отношения с Иваном Грозным:", options: ["Хакназар", "Касым", "Тауекел", "Шыгай"], correct: 0, explanation: "Хакназар хан (1538–1580) объединил племена и наладил связи с Москвой (Иваном IV)." },
            { q: "В 20-х годах XVIII века Джунгария, заключившая мирное соглашение с империей Цин, направила все свои силы на:", options: ["Нападение на казахские земли", "Покорение Тибета", "Завоевание Сибири", "Покорение Монголии"], correct: 0, explanation: "После перемирия с Китаем в 1722 г., джунгары бросили войска на казахов, начав «Годы Великого бедствия»." },
            { q: "В записях М.Х. Дулати причина казни эмиров и беков Тоглук Тимуром:", options: ["За то, что они не приняли ислам", "За оставление рядов армии", "За прекращение войны", "За выступление против власти"], correct: 0, explanation: "Тоглук Тимур сделал ислам государственной религией в Могулистане и жестоко карал отступников." },
            { q: "С 1949 года на превращение Казахстана в зону экологического бедствия повлияло:", options: ["Открытие Семипалатинского полигона", "Освоение целинных земель", "Открытие полиметаллического предприятия", "Завод по производству гербицидов"], correct: 0, explanation: "29 августа 1949 г. на Семипалатинском ядерном полигоне прошло первое испытание бомбы." },
            { q: "Крепость, построенная в Жетысу в 40-х годах XIX века:", options: ["Капал", "Семей", "Оскемен", "Акмола"], correct: 0, explanation: "Укрепление Капал было заложено в 1847 году в Семиречье." },
            { q: "Согласно Декрету о «Натуральном мясном налоге» (1921 г.), от налога освобождались:", options: ["Кочевые казахские крестьяне", "Оседлые русские крестьяне", "Ремесленники и торговцы", "Оседлые казахские крестьяне"], correct: 0, explanation: "Кочевники были освобождены от налога из-за катастрофических последствий джута и разрухи." },
            { q: "Труд Абу Райхана аль-Бируни:", options: ["Памятники минувших поколений", "Тарих-и Рашиди", "Книга путей и государств", "Диуани Хикмет"], correct: 0, explanation: "«Памятники минувших поколений» — знаменитый хронологический труд Аль-Бируни." },
            { q: "Главная причина восстания под предводительством Кенесары Касымова:", options: ["Колониальный гнет", "Увеличение налогов султанами", "Создание генерал-губернаторств", "Гнет Сибирского ханства"], correct: 0, explanation: "Целью Кенесары было остановить колониальную экспансию России и сохранить независимость." },

            { q: "Чем закончилась битва между войском царицы Томирис и войском персидского царя Кира?", options: ["Войско Кира потерпело поражение, сам царь погиб", "Персы победили", "Заключен мирный договор", "Кир захватил в плен Томирис"], correct: 0, explanation: "Массагеты победили, а Томирис приказала окунуть голову убитого Кира в мешок с кровью." },
            { q: "Древнее название реки Сырдарьи:", options: ["Яксарт", "Итил", "Талас", "Джейхун"], correct: 0, explanation: "В древних источниках Сырдарья упоминается как Яксарт." },
            { q: "Настоящее имя Абылай хана:", options: ["Абильмансур", "Сабалак", "Темучин", "Уали"], correct: 0, explanation: "Настоящее имя Абылая — Абильмансур. «Сабалак» — это его прозвище в юности." },
            { q: "Столица усуней:", options: ["Чигучен (Город Красной долины)", "Суяб", "Янгикент", "Битянь"], correct: 0, explanation: "Столица усуней называлась Чигу (или Чигучен) у озера Иссык-Куль." },
            { q: "Свод законов «Жеті жарғы» был принят при хане:", options: ["Тауке", "Касыме", "Есиме", "Хакназаре"], correct: 0, explanation: "Свод обычного права «Жеті жарғы» был утвержден при Тауке хане с участием биев." },

            { q: "Какая стоянка эпохи энеолита свидетельствует о первом одомашнивании лошади?", options: ["Ботай", "Пеньки", "Карабас", "Шекты"], correct: 0, explanation: "Поселение Ботай (Северный Казахстан) — памятник, где впервые в мире приручили лошадь." },

                                <div class="w-12 h-12 bg-slate-700/50 text-slate-500 rounded-2xl flex items-center justify-center border border-slate-700"><i data-lucide="calculator" class="w-6 h-6"></i></div>
                                <span class="bg-slate-800 text-slate-500 text-[10px] font-bold px-3 py-1.5 rounded-full uppercase tracking-widest">Скоро</span>
                            </div>
                            <div class="mt-auto">
                                <h3 class="text-xl font-bold text-slate-400">Математика</h3>
                                <p class="text-xs font-medium text-slate-600 mt-2">В разработке...</p>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
        `;

        const renderTest = () => {
            const q = state.questions[state.currentIndex];
            const currentNumber = state.currentIndex + 1;
            const total = state.questions.length;
            const progress = (currentNumber / total) * 100;
            const isChecked = state.isAnswerChecked;
            const userAns = state.answers[state.currentIndex];
            const shakeClass = (isChecked && userAns !== q.correctIndex) ? 'shake' : 'fade-in';

            let optionsHtml = q.options.map((opt, idx) => {
                const isSelected = userAns === idx;
                const isThisCorrect = idx === q.correctIndex;
                let btnStyle = 'border-slate-700 bg-slate-800/50 hover:bg-slate-700 hover:border-slate-500 text-slate-300';
                let iconHtml = `<div class="w-5 h-5 rounded-full border-[1.5px] border-slate-500 option-radio flex items-center justify-center mr-4 shrink-0"></div>`;
                
                if (isChecked) {
                    if (isThisCorrect) {
                        btnStyle = 'border-emerald-500/50 bg-emerald-500/10 text-emerald-100 shadow-[0_0_15px_rgba(16,185,129,0.15)]';
                        iconHtml = `<div class="w-6 h-6 bg-emerald-500 rounded-full flex items-center justify-center mr-3 shrink-0"><i data-lucide="check" class="w-4 h-4 text-slate-900"></i></div>`;
                    } else if (isSelected && !isThisCorrect) {
                        btnStyle = 'border-rose-500/50 bg-rose-500/10 text-rose-100';
                        iconHtml = `<div class="w-6 h-6 bg-rose-500 rounded-full flex items-center justify-center mr-3 shrink-0"><i data-lucide="x" class="w-4 h-4 text-slate-900"></i></div>`;
                    } else {
                        btnStyle = 'border-slate-800 bg-slate-900/50 text-slate-600 opacity-50 cursor-not-allowed';
                    }
                } else if (isSelected) {
                    btnStyle = 'border-indigo-500 bg-indigo-500/10 text-indigo-100';
                    iconHtml = `<div class="w-5 h-5 rounded-full border-2 border-indigo-500 option-radio flex items-center justify-center mr-4 shrink-0"><div class="w-2.5 h-2.5 bg-indigo-500 rounded-full"></div></div>`;
                }

                return `<div onclick="${isChecked ? '' : `selectOption(${idx})`}" class="flex items-center p-4 rounded-2xl border-2 ${btnStyle} cursor-pointer transition-all mb-3 ${isChecked ? '' : 'active:scale-[0.98]'}">
                            ${iconHtml}
                            <span class="text-[15px] md:text-base font-medium leading-snug">${opt.text}</span>
                        </div>`;
            }).join('');

            let explanationHtml = '';
            if (isChecked) {
                const isCorrect = userAns === q.correctIndex;
                const boxColor = isCorrect ? 'border-emerald-500/50 bg-emerald-500/5 text-emerald-200' : 'border-rose-500/50 bg-rose-500/5 text-rose-200';
                const titleColor = isCorrect ? 'text-emerald-400' : 'text-rose-400';
                explanationHtml = `
                    <div class="mt-6 pop-in p-5 rounded-2xl border ${boxColor}">
                        <div class="flex items-start gap-3">
                            <i data-lucide="${isCorrect ? 'lightbulb' : 'info'}" class="w-5 h-5 ${titleColor} shrink-0 mt-0.5"></i>
                            <div>
                                <strong class="${titleColor} block mb-1 tracking-wide uppercase text-xs font-extrabold">${isCorrect ? 'В точку!' : 'Запомни это'}</strong>
                                <p class="text-sm leading-relaxed opacity-90">${q.explanation}</p>
                            </div>
                        </div>
                    </div>`;
            }

            return `
                <div class="max-w-2xl mx-auto pb-10 ${shakeClass}">
                    <div class="flex items-center justify-between mb-8">
                        <div class="flex gap-2">
                            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl font-bold text-sm text-slate-300">
                                Вопрос <span class="text-white">${currentNumber}</span> <span class="text-slate-500">/ ${total}</span>
                            </div>
                            <div class="bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl font-bold text-sm text-slate-300 flex items-center gap-1.5">
                                <i data-lucide="timer" class="w-4 h-4 text-indigo-400"></i> <span id="timer-display">${formatTime(state.timer)}</span>
                            </div>
                        </div>
                        <div class="flex items-center gap-1.5 ${state.streak > 0 ? 'text-orange-400 pop-in' : 'text-slate-600'} bg-slate-800 border border-slate-700 px-3 py-1.5 rounded-xl font-bold text-sm transition-colors">
                            <i data-lucide="flame" class="w-4 h-4 ${state.streak > 1 ? 'fill-orange-400' : ''}"></i> ${state.streak > 0 ? `Комбо x${state.streak}` : 'Комбо 0'}
                        </div>
                    </div>

                    <div class="w-full bg-slate-800 rounded-full h-2 mb-8 overflow-hidden shadow-inner">
                        <div class="bg-gradient-to-r from-indigo-500 to-purple-500 h-2 rounded-full transition-all duration-500 ease-out" style="width: ${progress}%"></div>
                    </div>

                    <h2 class="text-xl md:text-2xl font-bold text-white mb-6 leading-relaxed bg-slate-800/40 p-5 rounded-2xl border border-slate-700/50">${q.q}</h2>
                    <div class="space-y-0">${optionsHtml}</div>
                    ${explanationHtml}

                    <div class="mt-8 flex justify-end">
                        ${!isChecked ? `
                            <button onclick="checkAnswer()" class="px-8 py-3.5 rounded-2xl font-bold text-sm transition-all flex items-center gap-2
                                ${userAns !== undefined ? 'bg-indigo-600 text-white hover:bg-indigo-500 shadow-[0_0_20px_rgba(79,70,229,0.3)]' : 'bg-slate-800 text-slate-500 cursor-not-allowed border border-slate-700'}"
                                ${userAns === undefined ? 'disabled' : ''}>Проверить <i data-lucide="check-circle-2" class="w-4 h-4"></i>
                            </button>
                        ` : `
                            <button onclick="nextQuestion()" class="px-8 py-3.5 rounded-2xl font-bold text-sm bg-white text-slate-900 hover:bg-slate-200 shadow-lg shadow-white/10 transition-all flex items-center gap-2 pop-in">
                                ${currentNumber === total ? 'Завершить тест <i data-lucide="flag" class="w-4 h-4"></i>' : 'Дальше <i data-lucide="arrow-right" class="w-4 h-4"></i>'}
                            </button>
                        `}
                    </div>
                </div>`;
        };

        const renderResult = () => {
            const pct = Math.round((state.correctCount / state.questions.length) * 100);
            let fb = { msg: "Ты зверь! 🔥", color: "text-emerald-400", bg: "bg-emerald-500/20 border-emerald-500/30", icon: "crown" };
            if(pct < 50) fb = { msg: "Надо поднажать 📚", color: "text-rose-400", bg: "bg-rose-500/20 border-rose-500/30", icon: "alert-triangle" };
            else if(pct < 80) fb = { msg: "Хороший результат 👍", color: "text-indigo-400", bg: "bg-indigo-500/20 border-indigo-500/30", icon: "thumbs-up" };

            return `
                <div class="fade-in max-w-2xl mx-auto space-y-6 flex flex-col items-center justify-center min-h-[70vh]">
                    <div class="w-full bg-slate-800/80 border border-slate-700 p-10 rounded-[2rem] shadow-2xl text-center relative overflow-hidden backdrop-blur-md">
                        <div class="inline-flex items-center justify-center w-20 h-20 rounded-2xl border ${fb.bg} mb-6"><i data-lucide="${fb.icon}" class="w-10 h-10 ${fb.color}"></i></div>
                        <h2 class="text-6xl font-extrabold text-white mb-3 tracking-tighter">${state.correctCount} <span class="text-3xl text-slate-500 font-medium">/ ${state.questions.length}</span></h2>
                        <p class="text-xl font-bold ${fb.color} mb-6">${fb.msg}</p>
                        
                        <div class="flex items-center justify-center gap-2 text-xs text-emerald-400 bg-emerald-500/10 border border-emerald-500/20 py-2 px-4 rounded-xl mb-6 font-semibold max-w-xs mx-auto">
                            <i data-lucide="check-circle" class="w-4 h-4"></i> Результат успешно сохранен в базу
                        </div>

                        <div class="flex flex-wrap justify-center gap-4 text-sm font-semibold text-slate-300 mb-8">
                            <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-2xl flex items-center gap-2"><i data-lucide="target" class="w-5 h-5 text-emerald-400"></i> Точность: ${pct}%</div>
                            <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-2xl flex items-center gap-2"><i data-lucide="timer" class="w-5 h-5 text-indigo-400"></i> Время: ${formatTime(state.timer)}</div>
                            <div class="bg-slate-900 border border-slate-700 px-5 py-3 rounded-2xl flex items-center gap-2"><i data-lucide="flame" class="w-5 h-5 text-orange-400"></i> Макс. комбо: ${state.maxStreak}</div>
                        </div>

                        <div class="flex flex-col sm:flex-row justify-center gap-3">
                            <button onclick="openReviewModal()" class="px-5 py-3.5 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-colors w-full sm:w-auto text-sm flex items-center justify-center gap-2"><i data-lucide="file-text" class="w-4 h-4"></i> Разбор вопросов</button>
                            <button onclick="navigate('dashboard')" class="px-5 py-3.5 bg-slate-700 hover:bg-slate-600 text-white rounded-2xl font-bold transition-colors w-full sm:w-auto text-sm"><i data-lucide="rotate-ccw" class="w-4 h-4 inline mr-2"></i> Еще тест</button>
                            <button onclick="navigate('history')" class="px-5 py-3.5 bg-indigo-600 hover:bg-indigo-500 text-white rounded-2xl font-bold shadow-lg shadow-indigo-600/30 transition-all w-full sm:w-auto text-sm">Статистика <i data-lucide="arrow-right" class="w-4 h-4 inline ml-1"></i></button>
                        </div>
                    </div>
                </div>`;
        };

        const renderHistorySkeleton = () => `<div class="max-w-3xl mx-auto space-y-6 animate-pulse"><div class="h-8 bg-slate-800 rounded w-1/3 mb-8"></div><div class="flex gap-4 mb-8"><div class="flex-1 h-28 bg-slate-800 rounded-3xl"></div><div class="flex-1 h-28 bg-slate-800 rounded-3xl"></div></div><div class="space-y-4"><div class="h-24 bg-slate-800 rounded-3xl"></div><div class="h-24 bg-slate-800 rounded-3xl"></div></div></div>`;

        const renderHistory = () => {
            let listHtml = state.history.length === 0 ? `
                <div class="text-center py-20 bg-slate-800/30 rounded-3xl border border-slate-700 border-dashed">
                    <i data-lucide="ghost" class="w-12 h-12 text-slate-600 mx-auto mb-4"></i>
                    <h3 class="text-lg font-bold text-slate-400">Тут пока тихо</h3>
                    <button onclick="navigate('dashboard')" class="mt-6 px-6 py-3 bg-indigo-500/20 text-indigo-400 hover:bg-indigo-500/30 rounded-xl text-sm font-bold transition-colors">Начать тренировку</button>
                </div>` : 
                state.history.map((item, i) => {
                    const d = new Date(item.date);
                    const dateStr = `${d.toLocaleDateString('ru-RU', { day: 'numeric', month: 'short' })} • ${d.toLocaleTimeString('ru-RU', {hour: '2-digit', minute:'2-digit'})}`;
                    const pct = Math.round((item.score / item.total) * 100);
                    let bc = pct >= 80 ? 'text-emerald-400 bg-emerald-500/10 border-emerald-500/20' : (pct >= 50 ? 'text-indigo-400 bg-indigo-500/10 border-indigo-500/20' : 'text-rose-400 bg-rose-500/10 border-rose-500/20');
                    return `
                        <div class="flex flex-col sm:flex-row sm:items-center justify-between p-5 bg-slate-800/50 rounded-3xl border border-slate-700/80 hover:border-slate-500 transition-colors mb-4 gap-4">
                            <div class="flex items-center gap-5">
                                <div class="w-12 h-12 rounded-2xl bg-slate-900 border border-slate-700 flex items-center justify-center font-extrabold text-slate-500 text-sm">#${state.history.length - i}</div>
                                <div>
                                    <h4 class="font-bold text-white text-base">История Казахстана</h4>
                                    <div class="flex items-center gap-3 text-xs font-medium text-slate-400 mt-1.5"><span>${dateStr}</span><span class="w-1 h-1 rounded-full bg-slate-600"></span><span class="flex items-center"><i data-lucide="timer" class="w-3 h-3 mr-1"></i>${formatTime(item.time || 0)}</span></div>
                                </div>
                            </div>
                            <div class="flex items-center justify-between sm:justify-end gap-5">
                                <div class="text-left sm:text-right"><div class="font-extrabold text-white text-lg">${item.score} <span class="text-slate-500 font-medium text-sm">/ ${item.total}</span></div></div>
                                <div class="px-3 py-1.5 rounded-xl font-bold text-sm tracking-wide border ${bc}">${pct}%</div>
                            </div>
                        </div>`;
                }).join('');

            return `
                <div class="fade-in max-w-3xl mx-auto space-y-8">
                    <div class="flex items-center justify-between">
                        <h2 class="text-3xl font-extrabold text-white">Твои успехи</h2>
                        ${state.history.length > 0 ? `<button onclick="clearHistory()" class="text-xs font-bold text-rose-400 hover:text-rose-300 bg-rose-500/10 border border-rose-500/20 px-3 py-2 rounded-xl transition-colors">Очистить историю</button>` : ''}
                    </div>
                    <div class="grid grid-cols-2 gap-4 md:gap-6">
                        <div class="bg-slate-800/80 p-6 rounded-3xl border border-slate-700 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-indigo-500/10 rounded-full blur-2xl"></div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Средняя точность</p>
                            <p class="text-4xl font-extrabold text-white flex items-baseline gap-1">${state.stats.avg}<span class="text-xl text-indigo-400">%</span></p>
                        </div>
                        <div class="bg-slate-800/80 p-6 rounded-3xl border border-slate-700 relative overflow-hidden">
                            <div class="absolute -right-4 -top-4 w-24 h-24 bg-orange-500/10 rounded-full blur-2xl"></div>
                            <p class="text-xs font-bold text-slate-400 uppercase tracking-widest mb-2">Макс. Комбо</p>
                            <p class="text-4xl font-extrabold text-white flex items-baseline gap-2">${state.stats.maxCombo} <i data-lucide="flame" class="w-6 h-6 fill-orange-400 text-orange-400"></i></p>
                        </div>
                    </div>
                    <div class="mt-8"><h3 class="text-sm font-bold text-slate-500 uppercase tracking-widest mb-5">Сохраненные результаты в базе</h3>${listHtml}</div>
                </div>`;
        };

        window.startTest = () => {
            state.answers = []; state.currentIndex = 0; state.timer = 0;
            state.isAnswerChecked = false; state.streak = 0; state.maxStreak = 0; state.correctCount = 0;
            
            const selected = shuffle([...questionBank]).slice(0, 10);
            state.questions = selected.map(q => {
                const optsWithMeta = q.options.map((text, i) => ({ text, isCorrect: i === q.correct }));
                const shuffledOpts = shuffle(optsWithMeta);
                return { q: q.q, options: shuffledOpts, correctIndex: shuffledOpts.findIndex(o => o.isCorrect), explanation: q.explanation };
            });

            navigate('test'); startTimer();
        };

        const startTimer = () => {
            clearInterval(state.timerInterval);
            state.timerInterval = setInterval(() => {
                state.timer++;
                const tEl = document.getElementById('timer-display');
                if (tEl) tEl.innerText = formatTime(state.timer);
            }, 1000);
        };

        window.selectOption = (idx) => { if (!state.isAnswerChecked) { state.answers[state.currentIndex] = idx; renderApp(); } };
        window.checkAnswer = () => {
            if (state.answers[state.currentIndex] === undefined) return;
            state.isAnswerChecked = true;
            if (state.answers[state.currentIndex] === state.questions[state.currentIndex].correctIndex) {
                state.streak++; state.correctCount++; if (state.streak > state.maxStreak) state.maxStreak = state.streak;
            } else { state.streak = 0; }
            renderApp();
        };
        window.nextQuestion = () => {
            if (state.currentIndex < state.questions.length - 1) { state.currentIndex++; state.isAnswerChecked = false; renderApp(); }
            else { finishTest(); }
        };

        const finishTest = async () => {
            clearInterval(state.timerInterval);
            
            // Сохраняем детали для разбора
            state.lastTestDetails = state.questions.map((q, i) => ({
                q: q.q,
                options: q.options,
                userAns: state.answers[i],
                correctIdx: q.correctIndex,
                explanation: q.explanation
            }));

            const record = { score: state.correctCount, total: state.questions.length, time: state.timer, maxStreak: state.maxStreak, date: new Date().toISOString() };
            
            if (user && !useLocalFallback) {
                try { await addDoc(collection(db, 'artifacts', appId, 'users', user.uid, 'history_v3'), record); } catch (e) { console.error(e); }
            } else {
                let localHist = JSON.parse(localStorage.getItem('entElite_history') || '[]'); localHist.push(record); localStorage.setItem('entElite_history', JSON.stringify(localHist));
            }
            navigate('result');
        };

        const loadHistory = async () => {
            let data = [];
            if (user && !useLocalFallback) {
                try {
                    const snap = await getDocs(collection(db, 'artifacts', appId, 'users', user.uid, 'history_v3'));
                    snap.forEach(doc => data.push(doc.data()));
                } catch (e) { console.error(e); }
            } else { data = JSON.parse(localStorage.getItem('entElite_history') || '[]'); }
            data.sort((a, b) => new Date(b.date) - new Date(a.date)); state.history = data;
            state.stats.total = data.length;
            if (data.length > 0) {
                const tPct = data.reduce((acc, curr) => acc + (curr.score / curr.total), 0);
                state.stats.avg = Math.round((tPct / data.length) * 100);
                state.stats.maxCombo = Math.max(...data.map(d => d.maxStreak || 0));
            } else { state.stats.avg = 0; state.stats.maxCombo = 0; }
        };

        window.clearHistory = () => {
            if (confirm("Точно очистить всю историю результатов?")) {
                if (useLocalFallback) {
                    localStorage.removeItem('entElite_history');
                }
                state.history = [];
                renderApp();
            }
        };

        /* --- МОДАЛЬНОЕ ОКНО РАЗБОРА ОШИБОК --- */
        window.openReviewModal = () => {
            const body = document.getElementById('review-modal-body');
            let html = '';
            if (!state.lastTestDetails) {
                html = `<p class="text-slate-400 text-center py-6">Нет данных последнего теста.</p>`;
            } else {
                html = state.lastTestDetails.map((item, idx) => {
                    const isOk = item.userAns === item.correctIdx;
                    const borderC = isOk ? 'border-emerald-500/30 bg-emerald-500/5' : 'border-rose-500/30 bg-rose-500/5';
                    const icon = isOk ? '<i data-lucide="check-circle" class="w-5 h-5 text-emerald-400 shrink-0"></i>' : '<i data-lucide="x-circle" class="w-5 h-5 text-rose-400 shrink-0"></i>';
                    
                    return `
                        <div class="p-4 rounded-2xl border ${borderC} space-y-2">
                            <div class="flex items-start gap-3">
                                ${icon}
                                <h4 class="font-bold text-white text-sm">${idx + 1}. ${item.q}</h4>
                            </div>
                            <div class="pl-8 text-xs space-y-1">
                                <p class="text-slate-300">Твой ответ: <span class="${isOk ? 'text-emerald-400 font-bold' : 'text-rose-400 font-bold'}">${item.userAns !== undefined ? item.options[item.userAns].text : 'Нет ответа'}</span></p>
                                ${!isOk ? `<p class="text-emerald-400 font-semibold">Правильно: ${item.options[item.correctIdx].text}</p>` : ''}
                                <p class="text-slate-400 mt-2 italic bg-slate-900/50 p-2 rounded-lg">${item.explanation}</p>
                            </div>
                        </div>
                    `;
                }).join('');
            }
            body.innerHTML = html;
            lucide.createIcons();

            const modal = document.getElementById('review-modal');
            const content = document.getElementById('review-modal-content');
            modal.classList.remove('hidden'); modal.classList.add('flex');
            setTimeout(() => { modal.classList.remove('opacity-0'); content.classList.remove('scale-95'); }, 10);
        };

        window.closeReviewModal = () => {
            const modal = document.getElementById('review-modal');
            const content = document.getElementById('review-modal-content');
            modal.classList.add('opacity-0'); content.classList.add('scale-95');
            setTimeout(() => { modal.classList.add('hidden'); modal.classList.remove('flex'); }, 200);
        };

        let pendingView = null;
        window.showExitModal = (view) => { pendingView = view; document.getElementById('exit-modal').classList.remove('hidden'); document.getElementById('exit-modal').classList.add('flex'); setTimeout(() => { document.getElementById('exit-modal').classList.remove('opacity-0'); document.getElementById('exit-modal-content').classList.remove('scale-95'); }, 10); };
        window.closeExitModal = () => { document.getElementById('exit-modal').classList.add('opacity-0'); document.getElementById('exit-modal-content').classList.add('scale-95'); setTimeout(() => { document.getElementById('exit-modal').classList.add('hidden'); document.getElementById('exit-modal').classList.remove('flex'); pendingView = null; }, 200); };
        window.confirmExitTest = () => { clearInterval(state.timerInterval); closeExitModal(); state.view = pendingView; pendingView = null; updateNav(); renderApp(); };

        const initAuth = async () => {
            if (useLocalFallback) return finishInit();
            try {
                if (typeof __initial_auth_token !== 'undefined' && __initial_auth_token) await signInWithCustomToken(auth, __initial_auth_token);
                else await signInAnonymously(auth);
            } catch (error) { useLocalFallback = true; finishInit(); }
        };
        const finishInit = () => { document.getElementById('loader').style.display = 'none'; navigate('dashboard'); };
        if (!useLocalFallback) { onAuthStateChanged(auth, (currentUser) => { user = currentUser; if (user) finishInit(); }); initAuth(); } else { finishInit(); }
    </script>
</body>
</html>
